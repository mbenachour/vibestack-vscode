name: Build and Publish VS Code Extension

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: write
  pull-requests: read
  security-events: write

jobs:
  # Secret scanning job
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if base and head are different
        id: git-check
        run: |
          BASE_SHA=$(git rev-parse origin/${{ github.event.repository.default_branch }} 2>/dev/null || echo "")
          HEAD_SHA=$(git rev-parse HEAD)

          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "$HEAD_SHA" ]; then
            echo "has-diff=true" >> $GITHUB_OUTPUT
            echo "Base and HEAD are different, will run Trufflehog scan"
          else
            echo "has-diff=false" >> $GITHUB_OUTPUT
            echo "Base and HEAD are the same or no base branch, will skip Trufflehog scan"
          fi

      - name: Run Trufflehog OSS (Git History Scan)
        if: steps.git-check.outputs.has-diff == 'true'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: GitLeaks Secret Scanning
        if: github.event_name != 'release'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  # Build and test job
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run tests (if available)
        run: npm test --if-present

      - name: Package extension
        run: |
          npm install -g @vscode/vsce
          vsce package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: '*.vsix'

  # Security audit job
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: secret-scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Check for vulnerabilities with Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium
        continue-on-error: true

  # Publish to VS Code Marketplace
  publish-vscode-marketplace:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: [build-and-test, security-audit]
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce publish

      - name: Package and Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vsce package
          VSIX_FILE=$(ls *.vsix)
          gh release upload ${{ github.event.release.tag_name }} "$VSIX_FILE" --clobber

  # Publish to Open VSX Registry (alternative marketplace)
  publish-open-vsx:
    name: Publish to Open VSX Registry
    runs-on: ubuntu-latest
    needs: [build-and-test, security-audit]
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Install ovsx
        run: npm install -g ovsx

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: ovsx publish

  # Notify on completion
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [publish-vscode-marketplace, publish-open-vsx]
    if: always()
    
    steps:
      - name: Notify Success
        if: needs.publish-vscode-marketplace.result == 'success' && needs.publish-open-vsx.result == 'success'
        run: |
          echo "✅ Extension successfully published to both marketplaces!"
          
      - name: Notify Failure
        if: needs.publish-vscode-marketplace.result == 'failure' || needs.publish-open-vsx.result == 'failure'
        run: |
          echo "❌ Extension publishing failed. Check the logs for details."
          exit 1
