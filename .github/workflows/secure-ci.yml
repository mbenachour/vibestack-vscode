name: Secure CI/CD with Manual GitLeaks

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read

jobs:
  # Security scanning with manual GitLeaks setup
  security-scan:
    name: Security & Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitLeaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run GitLeaks with Custom Config
        run: |
          # Use our custom config if it exists, otherwise use default
          if [ -f ".gitleaks.toml" ]; then
            echo "Using custom GitLeaks configuration"
            gitleaks detect --source . --config .gitleaks.toml --verbose
          else
            echo "Using default GitLeaks configuration"
            gitleaks detect --source . --verbose
          fi
        continue-on-error: false

      - name: Run Trufflehog for Additional Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified --json
        continue-on-error: true

  # Build and validation
  build-validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    needs: security-scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Compile TypeScript
        run: npm run compile

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Package extension
        run: |
          npm install -g @vscode/vsce
          vsce package --allow-star-activation

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ github.sha }}
          path: '*.vsix'
          retention-days: 30

  # Publish (only on releases)
  publish:
    name: Publish Extension
    runs-on: ubuntu-latest
    needs: [security-scan, build-validate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npm install -g @vscode/vsce
          vsce publish --no-yarn

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npm install -g ovsx
          ovsx publish --no-yarn

      - name: Create Release Assets
        run: |
          npm install -g @vscode/vsce
          vsce package

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: '*.vsix'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
